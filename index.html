<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infinity Crasher - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B9D;
      --secondary: #A78BFA;
      --accent: #60EFFF;
      --bg-dark: #0A0A1F;
      --bg-card: rgba(20, 20, 45, 0.85);
      --text-main: #FFFFFF;
      --text-muted: #B4B4C8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background */
    .bg-anime {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.15), transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(167, 139, 250, 0.15), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(96, 239, 255, 0.1), transparent 50%);
      z-index: 0;
      animation: bgShift 15s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(5deg); }
    }

    /* Sakura Petals */
    .sakura {
      position: fixed;
      width: 10px; height: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50% 0;
      opacity: 0.3;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
